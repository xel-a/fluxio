apiVersion: 1

datasources:
  - name: Postgres
    type: postgres
    url: ${POSTGRES_CONTAINER_NAME}:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      # optional default connection pool limit
      # maxOpenConns: 100
      # maxIdleConns: 100
      # connMaxLifetime: 14400
      # postgresLifetime: 1600
      # postgresVersion: 1600
      # used for time-series data
      # timescaledb: false